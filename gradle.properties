org.gradle.jvmargs=-Xmx4096m
# Gradle settings for Jenkins CI
org.gradle.daemon=false
org.gradle.daemon.idletimeout=10000
# Caps test forks as well as other workers. Jenkins agents have 8 processors; 5 leaves room for the
# Gradle daemon and the parallel security-check and Docker-build branches. Each unit-test fork has a
# 1.5 GB heap, so raise this with the agent's memory in mind.
org.gradle.workers.max=5
org.gradle.parallel=true
org.gradle.configureondemand=true
