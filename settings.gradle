pluginManagement {
  repositories {
    mavenLocal()
    // The HMCTS mirror is only reachable from the Jenkins network.
    if (System.getenv('JENKINS_URL')) {
      maven {
        url = uri('https://artifactory.platform.hmcts.net/artifactory/maven-remotes')
      }
    } else {
      mavenCentral()
    }
    gradlePluginPortal()
    maven {
      url = "https://pkgs.dev.azure.com/hmcts/Artifacts/_packaging/hmcts-lib/maven/v1"
    }
    maven { url = 'https://repo.spring.io/release' }
  }
}
rootProject.name = 'civil-service'
