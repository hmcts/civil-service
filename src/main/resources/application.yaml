server:
  port: 4000

management:
  endpoint:
    health:
      show-details: "always"
      probes:
        enabled: true
  endpoints:
    web:
      base-path: /
      exposure:
        include: health, info, prometheus
  health:
    case-document-am-api:
      enabled: true
spring:
  config:
    import: "optional:configtree:/mnt/secrets/civil/"
  application:
    name: civil-service
  main:
    allow-bean-definition-overriding: true
  task:
    scheduling:
      thread-name-prefix: civil-scheduler-
      pool:
        size: ${SCHEDULER_THREAD_POOL_SIZE:5}
      shutdown:
        await-termination: true
        await-termination-period: 20s
  cache:
    cache-names: userInfoCache, accessTokenCache
    caffeine:
      spec: expireAfterWrite=3600s
  jpa:
    properties:
      hibernate.query.mutation_strategy: org.hibernate.query.sqm.mutation.internal.inline.InlineMutationStrategy
  datasource:
    driverClassName: org.postgresql.Driver
    username: ${CMC_DB_USERNAME:-}
    password: ${CMC_DB_PASSWORD:-}
    url: jdbc:postgresql://${CMC_DB_HOST:}:${CMC_DB_PORT:}/${CMC_DB_NAME:cmc}${CMC_DB_CONNECTION_OPTIONS:}

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  security:
    oauth2:
      client:
        provider:
          oidc:
            issuer-uri: ${idam.web.url}/o
        registration:
          oidc:
            client-id: ${IDAM_CLIENT_ID}
            client-secret: ${CIVIL_CLIENT_SECRET}
  flyway:
    enabled: ${REFERENCE_DATABASE_MIGRATION:true}
    placeholder-replacement: false
    table: schema_version
    baseline-on-migrate: true

  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: ${HTTP_CONNECT_TIMEOUT:5000}
            readTimeout: ${HTTP_READ_TIMEOUT:30000}
          core-case-data-api:
            readTimeout: ${CORE_CASE_DATA_API_READ_TIMEOUT:25000} # ccd-data-store-api
          ccd-access-data-store-api:
            readTimeout: ${CASE_ACCESS_DATA_STORE_API_READ_TIMEOUT:25000} # ccd-data-store-api
          cmc-claim-store:
            readTimeout: ${CMC_CLAIM_STORE_API_READ_TIMEOUT:25000}
          core-case-event-api:
            readTimeout: ${CORE_CASE_EVENT_API_READ_TIMEOUT:25000}

scheduler:
  active-schedulers: ${SCHEDULER_ACTIVE_SCHEDULERS:}
  circuitBreakerThreshold: ${CIRCUIT_BREAKER_THRESHOLD:5}
  lockAtLeastFor: ${LOCK_AT_LEAST_FOR:PT1M}
  lockAtMostFor: ${LOCK_AT_MOST_FOR:PT30M}
  defaultLockAtMostFor: ${DEFAULT_LOCK_AT_MOST_FOR:PT30M}
  judgement-buffer:
    cronExpression: ${CRON_EXPRESSION_JUDGEMENT_BUFFER:0 0 2 * * *}
  defendant-response:
    cronExpression: ${CRON_EXPRESSION_DEFENDANT_RESPONSE:0 1 16 * * ?}
  settlement-no-response-from-defendant-check:
    cronExpression: ${CRON_EXPRESSION_SETTLEMENT_NO_RESPONSE_FROM_DEFENDANT_CHECK:0 0 1 * * ?}
  full-admit-pay-immediately-no-payment-from-def:
    cronExpression: ${CRON_EXPRESSION_FULL_ADMIT_PAY_IMMEDIATELY_NO_PAYMENT_FROM_DEF:0 0 0 * * ?}
  hearing-fee:
    cronExpression: ${CRON_EXPRESSION_HEARING_FEE:0 0 0 * * ?}
  evidence-upload:
    cronExpression: ${CRON_EXPRESSION_EVIDENCE_UPLOAD:0 30 17 * * ?}
  bundle-creation:
    cronExpression: ${CRON_EXPRESSION_BUNDLE_CREATION:0 0 21 * * ?}
  hearing-cvp-link:
    cronExpression: ${CRON_EXPRESSION_HEARING_CVP_LINK:0 50 0 * * ?}
  polling-event-emitter:
    cronExpression: ${CRON_EXPRESSION_POLLING_EVENT_EMITTER:0 0 8-20 * * ?}
  automated-hearing-notice:
    cronExpression: ${CRON_EXPRESSION_AUTOMATED_HEARING_NOTICE:0 0 0,12 * * ?}
    serviceIds: ${AUTOMATED_HEARING_NOTICE_SERVICE_IDS:AAA6,AAA7}
  mediation-file-transfer:
    cronExpression: ${CRON_EXPRESSION_MEDIATION_FILE_TRANSFER:0 0 1 * * ?}
  take-case-offline:
    cronExpression: ${CRON_EXPRESSION_TAKE_CASE_OFFLINE:0 1 16 * * ?}
  trial-ready-notification:
    cronExpression: ${CRON_EXPRESSION_TRIAL_READY_NOTIFICATION:0 20 0 * * ?}
  trial-ready-check:
    cronExpression: ${CRON_EXPRESSION_TRIAL_READY_CHECK:0 30 0 * * ?}
  order-review-obligation-check:
    cronExpression: ${CRON_EXPRESSION_ORDER_REVIEW_OBLIGATION_CHECK:0 10 1 * * ?}
  decision-outcome:
    cronExpression: ${CRON_EXPRESSION_DECISION_OUTCOME:0 40 0 * * ?}
  case-dismissed:
    cronExpression: ${CRON_EXPRESSION_CASE_DISMISSED:0 0 0 * * ?}
  claim-details-notification-deadline:
    cronExpression: ${CRON_EXPRESSION_CLAIM_DETAILS_NOTIFICATION_DEADLINE:0 1 16 * * ?}
  ga-document-upload-notify:
    cronExpression: ${CRON_EXPRESSION_GA_DOCUMENT_UPLOAD_NOTIFY:0 0 23 * * ?}
  ga-proof-of-debt:
    cronExpression: ${CRON_EXPRESSION_GA_PROOF_OF_DEBT:0 0 16 * * ?}
  ga-order-made:
    cronExpression: ${CRON_EXPRESSION_GA_ORDER_MADE:0 15 16 * * ?}
  ga-unless-order:
    cronExpression: ${CRON_EXPRESSION_GA_UNLESS_ORDER:0 0 16 * * ?}
  request-for-reconsideration-notification:
    cronExpression: ${CRON_EXPRESSION_REQUEST_FOR_RECONSIDERATION_NOTIFICATION:0 10 0 * * ?}
  manage-stay-wa-task:
    cronExpression: ${CRON_EXPRESSION_MANAGE_STAY_WA_TASK:0 20 1 * * ?}
  default-back-pressure:
    initialDelay: ${DEFAULT_BACK_PRESSURE_INITIAL_DELAY:PT0S}
    maxDelay: ${DEFAULT_BACK_PRESSURE_MAX_DELAY:PT10S}
    delayIncreaseOnFailure: ${DEFAULT_BACK_PRESSURE_DELAY_INCREASE_ON_FAILURE:PT0.5S}
    delayIncreaseOnSlowCase: ${DEFAULT_BACK_PRESSURE_DELAY_INCREASE_ON_SLOW_CASE:PT0.25S}
    delayReductionOnSuccess: ${DEFAULT_BACK_PRESSURE_DELAY_REDUCTION_ON_SUCCESS:PT0.1S}
    slowCaseThreshold: ${DEFAULT_BACK_PRESSURE_SLOW_CASE_THRESHOLD:PT2S}
  expired-draft-store:
    cronExpression: ${CRON_EXPRESSION_EXPIRED_DRAFT_STORE:0 15 2 * * ?}
    batchSize: ${EXPIRED_DRAFT_STORE_BATCH_SIZE:500}
    maxBatchesPerRun: ${EXPIRED_DRAFT_STORE_MAX_BATCHES_PER_RUN:20}

search:
  judgement-buffer:
    pageSize: ${SEARCH_PAGE_SIZE_JUDGEMENT_BUFFER:50}
  defendant-response:
    pageSize: ${SEARCH_PAGE_SIZE_DEFENDANT_RESPONSE:50}
  evidence-upload:
    pageSize: ${SEARCH_PAGE_SIZE_EVIDENCE_UPLOAD:50}
  hearing-fee:
