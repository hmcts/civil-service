// TEMPORARY (DTSCCI-6734): unit tests with full tiered JIT and no CompileCommand exclusion
gradle.projectsEvaluated {
  rootProject.tasks.withType(Test).configureEach { t ->
    t.jvmArgs = t.jvmArgs.findAll { !it.startsWith('-XX:CompileCommand') }
    t.doFirst { logger.lifecycle("JVM args for ${t.name}: ${t.allJvmArgs.findAll { it.startsWith('-XX') }}") }
  }
}
