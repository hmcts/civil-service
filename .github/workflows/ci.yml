name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
      - refs/tags/*
    tags:
      - '*'

jobs:
  pii-log-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install Semgrep
        run: 'python -m pip install --only-binary=:all: semgrep==1.177.0'
      - name: Test PII logging rules
        run: semgrep test .semgrep
      - name: Scan changed application code for PII logging
        env:
          SEMGREP_BASELINE_COMMIT: ${{ github.event.pull_request.base.sha }}
        run: |
          semgrep scan --strict --metrics=off --no-rewrite-rule-ids \
            --config .semgrep/logging-pii.yml \
            --json-output semgrep-results.json \
            src/main
          python .semgrep/annotate.py semgrep-results.json

  # TEMPORARY (DTSCCI-6734): times the unit test task under different JIT settings. Remove before merge.
  test-timing:
    if: github.event_name == 'pull_request' && github.head_ref == 'DTSCCI-6734-unit-test-time'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [current, c1, noexclude, c1_noexclude]
    env:
      GRADLE_OPTS: -Dorg.gradle.workers.max=2
    steps:
      - uses: actions/checkout@v7
      - name: Set up Cache
        uses: actions/cache@v6
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle') }}
          restore-keys: ${{ runner.os }}-gradle-
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21.0.12+101.0.LTS
      - name: Compile
        run: ./gradlew testClasses
      - name: Unit tests
        run: |
          args=()
          if [ "${{ matrix.variant }}" != current ]; then
            args=(--init-script ".github/test-timing/${{ matrix.variant }}.gradle")
          fi
          start=$(date +%s)
          ./gradlew test "${args[@]}"
          echo "TEST_SECONDS=$(( $(date +%s) - start ))"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.variant }}
          path: build/test-results/test/*.xml

  build:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Dorg.gradle.workers.max=2
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: cmc
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - name: Set up Cache
        uses: actions/cache@v6
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle') }}
          restore-keys: ${{ runner.os }}-gradle-
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21.0.12+101.0.LTS
      - name: Run checks
        run: ./gradlew check
      - name: Run integration tests
        env:
          SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/cmc
          SPRING_DATASOURCE_JDBC_URL: jdbc:postgresql://localhost:5432/cmc
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
        run: ./gradlew integration
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: integration-tests-results
          path: build/reports/tests/integration
