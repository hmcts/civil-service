name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
      - refs/tags/*
    tags:
      - '*'

jobs:
  unit-benchmark:
    if: github.event_name == 'pull_request' && github.head_ref == 'DTSCCI-6919'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/cache@v6
        id: benchmark-cache
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle') }}
          restore-keys: ${{ runner.os }}-gradle-
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21.0.13+9.0.LTS
      - name: Verify benchmark measurement helpers
        run: python3 bin/test_unit_ci_benchmark.py
      - name: Two measured unit runs
        env:
          BENCHMARK_CACHE_HIT: ${{ steps.benchmark-cache.outputs.cache-hit }}
        run: python3 bin/unit-ci-benchmark.py --provider actions --workers 2
      - name: Publish benchmark data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-benchmark-actions
          path: benchmark-results/actions
          if-no-files-found: error
          retention-days: 14

  pii-log-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install Semgrep
        run: 'python -m pip install --only-binary=:all: semgrep==1.177.0'
      - name: Test PII logging rules
        run: semgrep test .semgrep
      - name: Scan changed application code for PII logging
        env:
          SEMGREP_BASELINE_COMMIT: ${{ github.event.pull_request.base.sha }}
        run: |
          semgrep scan --strict --metrics=off --no-rewrite-rule-ids \
            --config .semgrep/logging-pii.yml \
            --json-output semgrep-results.json \
            src/main
          python .semgrep/annotate.py semgrep-results.json

  build:
    if: github.event_name != 'pull_request' || github.head_ref != 'DTSCCI-6919'
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Dorg.gradle.workers.max=2
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: cmc
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --name postgres
    steps:
      - uses: actions/checkout@v7
      - name: Increase PostgreSQL Max Connections
        run: |
          docker exec -i postgres bash -c 'sed -i "s/max_connections = 100/max_connections = 300/" "$PGDATA/postgresql.conf"'
          docker restart --time 0 postgres
          sleep 5
      - name: Set up Cache
        uses: actions/cache@v6
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle') }}
          restore-keys: ${{ runner.os }}-gradle-
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21.0.13+9.0.LTS
      - name: Run checks
        run: ./gradlew check
      - name: Run integration tests
        env:
          SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/cmc
          SPRING_DATASOURCE_JDBC_URL: jdbc:postgresql://localhost:5432/cmc
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
        run: ./gradlew integration
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: integration-tests-results
          path: build/reports/tests/integration
