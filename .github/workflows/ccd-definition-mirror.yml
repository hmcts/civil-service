name: CCD definition mirror

# ccd-definition/civil and ccd-definition/generalapplication are a copy of hmcts/civil-ccd-definition at the
# commit in ccd-definition/.source-sha (see ccd-definition/README.md). Nothing builds from the copy yet, so an
# edit made here would be thrown away by CI without any error. This fails the PR instead.

on:
  pull_request:
    paths:
      - 'ccd-definition/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ccd-definition-mirror.yml'
  push:
    branches:
      - master
    paths:
      - 'ccd-definition/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ccd-definition-mirror.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ccd-definition-mirror-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  matches-source:
    name: Mirror matches civil-ccd-definition
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read the source commit
        id: source
        run: |
          sha=$(tr -d '[:space:]' < ccd-definition/.source-sha)
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error file=ccd-definition/.source-sha::Expected a full 40-character civil-ccd-definition commit SHA, got '$sha'."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # Checkout fetches any commit in the repo, including unmerged branches and pull request heads.
      # The mirror must only ever be taken from master.
      - name: Check the commit is on civil-ccd-definition master
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          if ! status=$(gh api "repos/hmcts/civil-ccd-definition/compare/${SOURCE_SHA}...master" --jq .status); then
            echo "::error file=ccd-definition/.source-sha::Could not compare ${SOURCE_SHA} with hmcts/civil-ccd-definition master. Check the commit exists."
            exit 1
          fi
          case "$status" in
            ahead|identical) ;;
            *)
              echo "::error file=ccd-definition/.source-sha::${SOURCE_SHA} is not on hmcts/civil-ccd-definition master (compare status: ${status}). Copy the mirror from a master commit."
              exit 1
              ;;
          esac

      - name: Check out civil-ccd-definition at that commit
        uses: actions/checkout@v7
        with:
          repository: hmcts/civil-ccd-definition
          ref: ${{ steps.source.outputs.sha }}
          path: .civil-ccd-definition
          persist-credentials: false
          sparse-checkout: |
            ccd-definition/civil
            ccd-definition/generalapplication

      - name: Compare
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          status=0
          for dir in civil generalapplication; do
            diff -r --brief ".civil-ccd-definition/ccd-definition/${dir}" "ccd-definition/${dir}" || status=1
          done
          if [ "$status" -ne 0 ]; then
            echo "::error::ccd-definition/civil and ccd-definition/generalapplication must match hmcts/civil-ccd-definition at ${SOURCE_SHA}. Make definition changes in civil-ccd-definition. To re-sync, copy its ccd-definition/civil and ccd-definition/generalapplication at a newer commit and put that commit in ccd-definition/.source-sha."
          fi
          exit "$status"

  specs:
    name: Definition specs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Run the definition specs
        run: npm run test:definitions
