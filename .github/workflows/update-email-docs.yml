name: Update email notification docs

on:
  push:
    branches: [master]
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

concurrency:
  group: update-email-docs
  cancel-in-progress: false

jobs:
  regenerate-docs:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Mint a GitHub App token that triggers PR checks
        # A GitHub App installation token, not GITHUB_TOKEN: events from the latter
        # do not start workflow runs, so the documentation PR would never acquire its
        # required checks. A fine-grained PAT would also work but is not the HMCTS
        # pattern and binds the updater to one person's repository access, because a
        # PAT's effective permissions are the intersection of its scopes and the
        # holder's own. See DTSPO-34545 and DTSPO-36344.
        #
        # The App must be installed on hmcts/civil-service with contents and
        # pull-requests write. Access is granted per repository in the App settings;
        # the secrets being readable here does not by itself grant it.
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.EMAIL_DOCS_APP_ID }}
          private-key: ${{ secrets.EMAIL_DOCS_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Check out current master
        uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - name: Check whether recorded CCD revisions still reproduce master
        id: recorded
        uses: ./.github/actions/email-docs
        with:
          mode: report
      - name: Regenerate with current CCD definitions
        uses: ./.github/actions/email-docs
        with:
          mode: write
          refresh: 'true'
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Test documentation PR lifecycle
        run: node --test .github/scripts/*email-docs*.test.cjs
      - name: Create or update documentation PR
        uses: actions/github-script@v9
        env:
          RECORDED_DOCS_IN_SYNC: ${{ steps.recorded.outputs.in-sync }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const update = require('./.github/scripts/update-email-docs-pr.cjs');
            await update({ github, context, exec, core,
              recordedInSync: process.env.RECORDED_DOCS_IN_SYNC === 'true' });
