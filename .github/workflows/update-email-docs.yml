name: Update email notification docs

on:
  push:
    branches: [master]
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

concurrency:
  group: update-email-docs
  cancel-in-progress: false

jobs:
  regenerate-docs:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Require a bot credential that triggers PR checks
        env:
          BOT_TOKEN: ${{ secrets.EMAIL_DOCS_BOT_TOKEN }}
        run: |
          if [[ -z "$BOT_TOKEN" ]]; then
            echo '::error::Configure EMAIL_DOCS_BOT_TOKEN with contents and pull-request write access; see README.'
            exit 1
          fi
      - name: Check out current master
        uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.EMAIL_DOCS_BOT_TOKEN }}
      - name: Check whether recorded CCD revisions still reproduce master
        id: recorded
        uses: ./.github/actions/email-docs
        with:
          mode: report
      - name: Regenerate with current CCD definitions
        uses: ./.github/actions/email-docs
        with:
          mode: write
          refresh: 'true'
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Test documentation PR lifecycle
        run: node --test .github/scripts/*email-docs*.test.cjs
      - name: Create or update documentation PR
        uses: actions/github-script@v9
        env:
          RECORDED_DOCS_IN_SYNC: ${{ steps.recorded.outputs.in-sync }}
        with:
          github-token: ${{ secrets.EMAIL_DOCS_BOT_TOKEN }}
          script: |
            const update = require('./.github/scripts/update-email-docs-pr.cjs');
            await update({ github, context, exec, core,
              recordedInSync: process.env.RECORDED_DOCS_IN_SYNC === 'true' });
