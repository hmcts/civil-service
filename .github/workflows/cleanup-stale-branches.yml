name: Clean up stale branches

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report eligible branches without deleting them'
        required: true
        type: boolean
        default: true
      days_before:
        description: 'Delete branches with no activity for this many days'
        required: true
        type: string
        default: '90'

concurrency:
  group: stale-branch-cleanup
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}
      DAYS_BEFORE: ${{ inputs.days_before || '90' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/github-script@v9
        with:
          script: |
            const { run } = require('./.github/scripts/cleanup-stale-branches.cjs');
            await run({
              github,
              context,
              core,
              dryRun: process.env.DRY_RUN === 'true',
              daysBefore: process.env.DAYS_BEFORE
            });
