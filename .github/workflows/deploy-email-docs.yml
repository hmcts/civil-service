name: Publish email notification docs

on:
  push:
    branches:
      - master
    paths:
      - 'docs/email-notifications.md'
      - 'docs/email-notifications.html'
      - '.github/workflows/deploy-email-docs.yml'
      - 'scripts/generate_email_notifications_table.py'
      - 'scripts/email_docs.py'
      - '.github/email-docs-sources.json'
      - '.github/actions/email-docs/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify the exact documents being published
        uses: ./.github/actions/email-docs
        with:
          mode: sync
      - name: Upload documentation artefact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
