name: Publish email notification docs

on:
  workflow_run:
    workflows: [Verify email notification documentation]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.repository == 'hmcts/civil-service' &&
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == 'hmcts/civil-service' &&
      github.event.workflow_run.head_branch == 'master' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')))
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out publication code
        uses: actions/checkout@v7
        with:
          # Execute publication helpers only from the trusted repository's master.
          # Never use the triggering run's head repository, branch or SHA here.
          repository: hmcts/civil-service
          ref: master
          persist-credentials: false
      - name: Select and download strictly verified documentation
        id: verified
        uses: actions/github-script@v9
        with:
          script: |
            const select = require('./.github/scripts/email-docs-artifact.cjs');
            const tree = await exec.getExecOutput('git', ['rev-parse', 'HEAD:docs']);
            const result = await select({ github, context, core, docsTree: tree.stdout.trim() });
            if (!result) return;
            const archive = await github.rest.actions.downloadArtifact({
              ...context.repo, artifact_id: result.artefactId, archive_format: 'zip',
            });
            require('node:fs').writeFileSync(`${process.env.RUNNER_TEMP}/email-docs.zip`, Buffer.from(archive.data));
            core.setOutput('found', 'true');
            await core.summary.addRaw(`Publishing documentation verified at ${result.sha} in Actions run ${result.runId}.\n`).write();
      - name: Unpack verified documentation
        if: steps.verified.outputs.found == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/verified-email-docs" "$RUNNER_TEMP/email-docs-package"
          unzip -q "$RUNNER_TEMP/email-docs.zip" -d "$RUNNER_TEMP/email-docs-package"
          tar -xf "$RUNNER_TEMP/email-docs-package/email-docs.tar" -C "$RUNNER_TEMP/verified-email-docs"
          diff -qr docs "$RUNNER_TEMP/verified-email-docs"
      - name: Upload documentation artefact
        if: steps.verified.outputs.found == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/verified-email-docs
      - name: Deploy to GitHub Pages
        if: steps.verified.outputs.found == 'true'
        id: deployment
        uses: actions/deploy-pages@v5
